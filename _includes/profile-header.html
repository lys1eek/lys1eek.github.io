<header class="profile-header">
  <div class="profile-header__identity">
    <img class="profile-header__avatar" src="{{ base_path }}/images/{{ site.author.avatar }}" alt="{{ site.author.name }}" width="112" height="112">
    <div>
      <p class="academic-eyebrow">USTC · Undergraduate</p>
      <h1>{{ site.author.name }} <span lang="zh-Hans">梁思源</span></h1>
      <p class="profile-header__field">Probability and Statistics</p>
    </div>
  </div>

  <div class="profile-header__signature" aria-hidden="true">
    {% include math-signature.html %}
  </div>

  <p class="profile-header__summary">Machine learning, stochastic optimization,<br class="profile-header__line-break"> and the mathematical foundations of AI.</p>

  <nav class="profile-header__links" aria-label="CV and contact links">
    <a class="academic-button academic-button--primary" href="{{ base_path }}/files/Siyuan_Liang_Academic_CV.pdf">English CV <span>(PDF)</span></a>
    <a class="academic-button" href="{{ base_path }}/files/CV.pdf" lang="zh-Hans">中文简历 <span>(PDF)</span></a>
    <a class="profile-header__text-link" href="mailto:{{ site.author.email }}">Email</a>
    <a class="profile-header__text-link" href="https://github.com/{{ site.author.github }}">GitHub</a>
  </nav>
</header>
