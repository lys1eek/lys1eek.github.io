{% include base_path %}

<a class="academic-skip-link" href="#main">Skip to content</a>
<header class="academic-masthead">
  <div class="academic-masthead__inner">
    <a class="academic-brand" href="{{ base_path }}/">{{ site.title }}</a>
    <nav id="academic-nav" class="academic-nav" aria-label="Main navigation">
      <button class="academic-nav__toggle" type="button" aria-expanded="false" aria-controls="academic-navigation-links">
        <span>Menu</span>
        <svg viewBox="0 0 20 20" width="20" height="20" fill="none" aria-hidden="true" focusable="false">
          <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </button>
      <ul id="academic-navigation-links" class="academic-nav__links">
        {% for link in site.data.navigation.main %}
          {% if link.url contains 'http' %}
            {% assign domain = '' %}
          {% else %}
            {% assign domain = base_path %}
          {% endif %}
          <li class="academic-nav__item">
            <a class="academic-nav__link" href="{{ domain }}{{ link.url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
